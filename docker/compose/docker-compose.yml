version: '3.8'

services:
  # Spark Manager
  spark-manager:
    image: spark:latest
    container_name: spark-manager
    ports:
      - "${MANAGER_PORT:-9000}:${MANAGER_PORT:-9000}"
    environment:
      # Service Type (Runtime Decision)
      - SERVICE_TYPE=manager
      
      # Core Configuration
      - NODE_ENV=${NODE_ENV:-production}
      - MANAGER_PORT=${MANAGER_PORT:-9000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      
      # Manager-specific Settings
      - AGENT_TIMEOUT=${AGENT_TIMEOUT:-300000}
      - CONFIG_SYNC_INTERVAL=${CONFIG_SYNC_INTERVAL:-60000}
      - MONITORING_RETENTION=${MONITORING_RETENTION:-86400000}
      
      # Default Configuration for Agents
      - DEFAULT_SCHEDULER_MODE=${DEFAULT_SCHEDULER_MODE:-continuous}
      - DEFAULT_SELECTED_LINK=${DEFAULT_SELECTED_LINK:-wifi}
      - DEFAULT_INTERVAL_MS=${DEFAULT_INTERVAL_MS:-5000}
      - DEFAULT_MAX_RETRIES=${DEFAULT_MAX_RETRIES:-3}
      - DEFAULT_TOKEN=${DEFAULT_TOKEN:-auto-generated}
      
      # Database Settings
      - DATABASE_TYPE=${DATABASE_TYPE:-file}
      - DATABASE_PATH=${DATABASE_PATH:-/app/data}
      - DATABASE_BACKUP=${DATABASE_BACKUP:-true}
      
      # Authentication
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - AUTH_SECRET=${AUTH_SECRET:-}
    volumes:
      - manager_data:/app/data
      - manager_logs:/app/logs
    networks:
      - spark-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "SERVICE_TYPE=manager ./docker/shared/health-check.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Spark Proxy
  spark-proxy:
    image: spark:latest
    container_name: spark-proxy
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
      - "${WS_PORT:-8081}:${WS_PORT:-8081}"
    environment:
      # Service Type (Runtime Decision)
      - SERVICE_TYPE=proxy
      
      # Core Configuration
      - NODE_ENV=${NODE_ENV:-production}
      - HTTP_PORT=${HTTP_PORT:-8080}
      - WS_PORT=${WS_PORT:-8081}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      
      # Proxy-specific Settings
      - MAX_CONNECTIONS=${MAX_CONNECTIONS:-1000}
      - MESSAGE_BUFFER_SIZE=${MESSAGE_BUFFER_SIZE:-10000}
      - MESSAGE_TIMEOUT=${MESSAGE_TIMEOUT:-30000}
      - ENABLE_COMPRESSION=${ENABLE_COMPRESSION:-true}
      - ENABLE_CORS=${ENABLE_CORS:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      
      # Rate Limiting
      - RATE_LIMITING_ENABLED=${RATE_LIMITING_ENABLED:-true}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      
      # WebSocket Settings
      - WS_PING_INTERVAL=${WS_PING_INTERVAL:-30000}
      - WS_PONG_TIMEOUT=${WS_PONG_TIMEOUT:-5000}
      - WS_MAX_PAYLOAD=${WS_MAX_PAYLOAD:-1048576}
      
      # Integration
      - FLOW_CONTROL_MANAGER_URL=http://spark-manager:${MANAGER_PORT:-9000}
      
      # Storage
      - STORAGE_TYPE=${STORAGE_TYPE:-file}
      - STORAGE_PATH=${STORAGE_PATH:-/app/data}
      - STORAGE_RETENTION=${STORAGE_RETENTION:-86400000}
    volumes:
      - proxy_data:/app/data
      - proxy_logs:/app/logs
    networks:
      - spark-network
    restart: unless-stopped
    depends_on:
      spark-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "SERVICE_TYPE=proxy ./docker/shared/health-check.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Spark Agent
  spark-agent:
    image: spark:latest
    container_name: spark-agent
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    environment:
      # Service Type (Runtime Decision)
      - SERVICE_TYPE=agent
      
      # Core Configuration
      - NODE_ENV=${NODE_ENV:-production}
      - API_PORT=${API_PORT:-3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      
      # Service URLs
      - PROXY_SERVER_URL=http://spark-proxy:${HTTP_PORT:-8080}/api/messages
      - FLOW_CONTROL_MANAGER_URL=http://spark-manager:${MANAGER_PORT:-9000}
      
      # Agent Configuration
      - AGENT_ID=${AGENT_ID:-}
      - DEFAULT_TOKEN=${DEFAULT_TOKEN:-}
      - SCHEDULER_MODE=${SCHEDULER_MODE:-continuous}
      - SELECTED_LINK=${SELECTED_LINK:-wifi}
      - INTERVAL_MS=${INTERVAL_MS:-5000}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      
      # Monitoring & Discovery
      - LINK_MONITORING_INTERVAL=${LINK_MONITORING_INTERVAL:-30000}
      - CONFIG_SYNC_INTERVAL=${CONFIG_SYNC_INTERVAL:-60000}
      - ENABLE_DISCOVERY=${ENABLE_DISCOVERY:-true}
      - DISCOVERY_PORT=${DISCOVERY_PORT:-8888}
      - HEALTH_CHECK_INTERVAL=${HEALTH_CHECK_INTERVAL:-30000}
      
      # Circuit Breaker
      - CIRCUIT_BREAKER_THRESHOLD=${CIRCUIT_BREAKER_THRESHOLD:-5}
      - CIRCUIT_BREAKER_TIMEOUT=${CIRCUIT_BREAKER_TIMEOUT:-60000}
    volumes:
      - agent_data:/app/data
      - agent_logs:/app/logs
    networks:
      - spark-network
    restart: unless-stopped
    depends_on:
      spark-manager:
        condition: service_healthy
      spark-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "SERVICE_TYPE=agent ./docker/shared/health-check.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Additional Agent Instance (same image, different config)
  spark-agent-2:
    image: spark:latest
    container_name: spark-agent-2
    ports:
      - "3001:${API_PORT:-3000}"
    environment:
      # Service Type (Runtime Decision)
      - SERVICE_TYPE=agent
      
      # Core Configuration
      - NODE_ENV=${NODE_ENV:-production}
      - API_PORT=${API_PORT:-3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      
      # Service URLs
      - PROXY_SERVER_URL=http://spark-proxy:${HTTP_PORT:-8080}/api/messages
      - FLOW_CONTROL_MANAGER_URL=http://spark-manager:${MANAGER_PORT:-9000}
      
      # Different configuration for testing
      - AGENT_ID=agent-2
      - SCHEDULER_MODE=interval
      - SELECTED_LINK=lan
      - INTERVAL_MS=10000
      - MAX_RETRIES=5
    volumes:
      - agent2_data:/app/data
      - agent2_logs:/app/logs
    networks:
      - spark-network
    restart: unless-stopped
    depends_on:
      spark-manager:
        condition: service_healthy
      spark-proxy:
        condition: service_healthy
    profiles:
      - multi-agent
    healthcheck:
      test: ["CMD", "sh", "-c", "SERVICE_TYPE=agent ./docker/shared/health-check.sh"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  spark-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  manager_data:
  manager_logs:
  proxy_data:
  proxy_logs:
  agent_data:
  agent_logs:
  agent2_data:
  agent2_logs:
      